[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "marco-mvp"
version = "0.1.0"
description = "Local scientific co-authoring and audit workbench"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.5.0",
]

[project.optional-dependencies]
test = ["pytest>=7.4.0"]
ui = ["streamlit>=1.30.0"]
pdf = ["pymupdf>=1.23.0"]
rag = ["rank-bm25>=0.2.2", "sentence-transformers>=2.2.2"]
openai = ["openai>=1.0.0"]
ollama = ["requests>=2.31.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["core*", "adapters*", "ui*"]
